[package]
name = "ichatpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["ichatpp contributors"]
license = "MIT"
description = "ichatpp backend — Rust + Actix-web realtime chat server"
publish = false

[dependencies]
# ── Web framework & async runtime ──
actix-web = "4.5"
actix-ws = "0.3"
actix-cors = "0.7"
actix-governor = "0.8"  # IP-keyed rate limiting (TODO [10])
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dashmap = "6"  # in-process Session registry for WebSocket fan-out (TODO [27])

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Database ──
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

# ── Redis ──
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# ── Auth & crypto ──
jsonwebtoken = "9"
bcrypt = "0.15"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# ── IDs & time ──
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ── Config & logging ──
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"

# ── Error handling ──
thiserror = "1"
anyhow = "1"

# ── Validation ──
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
actix-rt = "2"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

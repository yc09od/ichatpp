name: ichatpp

services:
  postgres:
    image: postgres:14
    container_name: ichatpp-postgres
    restart: unless-stopped
    # Defaults match the credentials baked into DATABASE_URL in .env
    # (vuugo:vuugo_dev@localhost:5432/ichatpp). Override with env vars to
    # diverge — but keep them aligned with DATABASE_URL or the backend
    # will hit auth failures.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vuugo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuugo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ichatpp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vuugo} -d ${POSTGRES_DB:-ichatpp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: ichatpp-redis
    restart: unless-stopped
    # `--requirepass` matches REDIS_URL=redis://:redis_dev@... in .env.
    # Without it the backend's auth attempt would fail with NOAUTH.
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--requirepass", "${REDIS_PASSWORD:-redis_dev}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # `-a` authenticates; without it `ping` returns NOAUTH and reports unhealthy.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ichatpp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the buckets ichatpp expects (avatars, emojis, exports)
  minio-init:
    image: minio/mc:latest
    container_name: ichatpp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/avatars local/emojis local/exports || true &&
      mc anonymous set download local/avatars local/emojis || true &&
      echo 'minio buckets ready'
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:

name: Backend CI

on:
  push:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

  # TODO [9]/[47]: When sqlx::query! macros land, add a postgres service
  # container here (or switch to SQLX_OFFLINE=true with `cargo sqlx prepare`
  # checked in to .sqlx/) so compile-time SQL verification works in CI.
